YAML

name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract project
        run: |
          unzip -q hesabdar_project.zip -d extracted
          PROJECT_DIR="$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hesabdar-man-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
